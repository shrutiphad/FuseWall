[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fusewall-local"
version = "0.2.0"
description = "A local, offline-first AI budget gateway and failure laboratory"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.4", "httpx==0.28.1"]

[project.scripts]
fusewall = "fusewall.__main__:main"

[tool.setuptools.package-data]
fusewall = ["static/*"]
